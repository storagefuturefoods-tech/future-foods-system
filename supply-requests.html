<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>طلبات التغذية</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>طلبات التغذية</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="inventory.html">المخزون</a>
      <a href="supply-requests.html">طلبات التغذية</a>
      <a href="settings.html">الإعدادات</a>
    </nav>
    <div class="user-info">
      <div class="cart-icon" onclick="openModal('cartModal')">🛒 <span class="cart-badge" id="cartCount">0</span></div>
      <span id="currentUserDisplay"></span>
      <button class="btn btn-secondary" onclick="toggleLanguage()">Ar/En</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <button class="btn" onclick="openSupplyModal()">+ طلب تغذية جديد</button>
        <div>
          <select id="statusFilter" onchange="loadOrders()" style="padding: 6px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px;">
            <option value="الكل">كل الحالات</option>
            <option value="جديد">جديد</option>
            <option value="جاري التجهيز">جاري التجهيز</option>
            <option value="جاهز">جاهز</option>
            <option value="مكتمل">مكتمل</option>
            <option value="ملغي">ملغي</option>
          </select>
          <button class="btn btn-secondary" onclick="exportOrders()">تصدير الطلبات</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllOrders" onclick="toggleSelectAllOrders(this)"></th>
            <th>رقم الطلب</th>
            <th>المستخدم</th>
            <th>البراند</th>
            <th>عدد المنتجات</th>
            <th>الحالة</th>
            <th>ملاحظات</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal اختيار المنتجات للطلب مع الهيدر الثابت -->
  <div id="supplyModal" class="modal">
    <div class="modal-content">
      
      <!-- الجزء الثابت في الأعلى -->
      <div class="modal-header-sticky">
        <div class="modal-title-bar">
          <h4 style="margin:0; font-weight:bold; color:var(--text-color);">إضافة طلب تغذية جديد</h4>
          <button class="btn-close-modal" onclick="closeModal('supplyModal')">✕</button>
        </div>
        <input 
          type="text" 
          id="prodSearch" 
          placeholder="بحث باسم المنتج أو الرمز..." 
          oninput="filterProducts()" 
          style="width:100%; padding:8px 12px; font-size:0.9rem; background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); border-radius:6px; outline:none;"
        >
      </div>

      <!-- منطقة المنتجات المخصصة للتمرير -->
      <div class="modal-body-scroll">
        <div id="productsGrid"></div>
      </div>

    </div>
  </div>

  <!-- Modal معاينة الصورة -->
  <div id="imgPreviewModal" class="img-preview-modal" onclick="closeImagePreview()">
    <span style="position: absolute; top: 20px; right: 25px; color: #fff; font-size: 35px; font-weight: bold; cursor: pointer;">&times;</span>
    <img id="previewImageSrc" src="" alt="معاينة المنتج">
  </div>

  <!-- Modal السلة -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <h3>سلة الطلبات</h3>
      <div id="cartItemsList"></div>
      <div class="form-group" style="margin-top:15px;">
        <label>ملاحظات الطلب:</label>
        <textarea id="orderNotes" rows="3"></textarea>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn" style="flex: 1;" onclick="submitOrder()">إرسال الطلب النهائي</button>
        <button class="btn btn-secondary" onclick="closeModal('cartModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Modal تفاصيل الطلب و سجل التعديلات -->
  <div id="orderDetailsModal" class="modal">
    <div class="modal-content">
      <h3>تفاصيل الطلب <span id="modalOrderNum"></span></h3>
      <div id="orderDetailsContent"></div>
      <div id="orderTimeline"></div>
      <button class="btn btn-secondary" style="margin-top:15px;" onclick="closeModal('orderDetailsModal')">إغلاق</button>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/supply.js"></script>
</body>
</html>
