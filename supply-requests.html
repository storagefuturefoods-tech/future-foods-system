<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Supply Requests</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .qty-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 4px;
      background: var(--primary-color, #2e7d32);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-btn:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .qty-input {
      width: 45px;
      height: 28px;
      text-align: center;
      border: 1px solid var(--border-color, #444);
      background: var(--input-bg, #222);
      color: var(--text-color, #fff);
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .product-card.selected {
      border: 1px solid var(--primary-color, #2e7d32) !important;
      background: rgba(46, 125, 50, 0.08);
    }
  </style>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
    <nav style="display: flex; align-items: center; gap: 12px;">
      <a href="index.html" title="Home" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-house"></i></a>
      <a href="inventory.html" title="Inventory" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-boxes-stacked"></i></a>
      <a href="supply-requests.html" title="Supply Requests" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-truck-ramp-box"></i></a>
      <a href="settings.html" title="Settings" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-gear"></i></a>
      
      <button class="btn btn-danger" onclick="logout()" title="Logout" style="padding: 6px 10px; border: none; background: transparent; color: #e53e3e; font-size: 1.2rem; cursor: pointer;">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </nav>
    
    <div class="user-info" style="display: flex; align-items: center; gap: 15px;">
      <span id="currentUserDisplay" style="font-weight: 600;"></span>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom: 15px;">
        <button class="btn" onclick="openSupplyModal()">+ New Supply Request</button>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <input 
            type="text" 
            id="orderSearch" 
            placeholder="Search by Order ID or User..." 
            oninput="loadOrders()" 
            style="padding: 6px 10px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; outline: none; min-width: 200px;"
          >
          <select id="statusFilter" onchange="loadOrders()" style="padding: 6px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px;">
            <option value="ALL">All Statuses</option>
            <option value="New">New</option>
            <option value="In Preparation">In Preparation</option>
            <option value="Ready">Ready</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <button class="btn btn-secondary" onclick="exportOrders()">Export Orders</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllOrders" onclick="toggleSelectAllOrders(this)"></th>
            <th>Order ID</th>
            <th>User</th>
            <th>Brand</th>
            <th>Items Count</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal: Select Products Direct -->
  <div id="supplyModal" class="modal">
    <div class="modal-content" style="max-height: 90vh; display: flex; flex-direction: column;">
      
      <div class="modal-header-sticky">
        <div class="modal-title-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h4 style="margin:0; font-weight:bold; color:var(--text-color);">Create Supply Request Direct</h4>
          <button class="btn-close-modal" onclick="closeModal('supplyModal')" style="background:none; border:none; color:var(--text-color); font-size:1.2rem; cursor:pointer;">✕</button>
        </div>
        
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <input 
            type="text" 
            id="prodSearch" 
            placeholder="Search by product name or SKU..." 
            oninput="filterProducts()" 
            style="flex: 2; min-width: 150px; padding:8px 10px; font-size:0.85rem; background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); border-radius:6px; outline:none;"
          >
          <select 
            id="categoryFilter" 
            onchange="filterProducts()" 
            style="flex: 1; min-width: 120px; padding:8px 10px; font-size:0.85rem; background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); border-radius:6px; outline:none;"
          >
            <option value="ALL">All Categories</option>
          </select>
        </div>
      </div>

      <!-- Products Grid Section -->
      <div class="modal-body-scroll" style="flex: 1; overflow-y: auto; padding: 10px 0;">
        <div id="productsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;"></div>
      </div>

      <!-- Direct Submission Footer -->
      <div style="border-top: 1px solid var(--border-color, #444); padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
        <input type="text" id="orderNotes" placeholder="Add order notes (optional)..." style="width: 100%; padding: 8px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; outline: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.9rem; font-weight: bold;">Selected Items: <span id="selectedCount" style="color: var(--primary-color, #2e7d32);">0</span></span>
          <button class="btn" style="padding: 8px 20px;" onclick="submitOrderDirect()">Submit Request</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal: Image Preview -->
  <div id="imgPreviewModal" class="img-preview-modal" onclick="closeImagePreview()">
    <span style="position: absolute; top: 20px; right: 25px; color: #fff; font-size: 35px; font-weight: bold; cursor: pointer;">&times;</span>
    <img id="previewImageSrc" src="" alt="Product Preview">
  </div>

  <!-- Modal: Order Details -->
  <div id="orderDetailsModal" class="modal">
    <div class="modal-content">
      <h3>Order Details <span id="modalOrderNum"></span></h3>
      <div id="orderDetailsContent"></div>
      <div id="orderTimeline"></div>
      <button class="btn btn-secondary" style="margin-top:15px;" onclick="closeModal('orderDetailsModal')">Close</button>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/supply.js"></script>
</body>
</html>
