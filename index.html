<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Supply Management</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .widget-card {
      background: var(--card-bg, #1e1e1e);
      border: 1px solid var(--border-color, #333);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color, #333);
    }
    .widget-title {
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-count {
      background: #e53e3e;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .badge-count.warning {
      background: #f59e0b;
    }
    .preview-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .preview-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--input-bg, #2a2a2a);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .preview-item img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color, #444);
    }
    .preview-info {
      flex: 1;
    }
    .preview-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-color, #fff);
    }
    .preview-sub {
      font-size: 0.75rem;
      color: var(--text-muted, #aaa);
    }

    .modal-low-stock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background: var(--input-bg, #222);
      border: 1px solid var(--border-color, #444);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .modal-low-stock-item img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color, #555);
    }

    .qty-picker {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .qty-picker-btn {
      width: 26px;
      height: 26px;
      border: none;
      background: var(--primary-color, #2563eb);
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-picker-input {
      width: 45px;
      height: 26px;
      text-align: center;
      border: 1px solid var(--border-color, #444);
      background: var(--card-bg, #1e1e1e);
      color: var(--text-color, #fff);
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    #pdfRenderArea {
      display: none;
      background: #ffffff;
      color: #000000;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #pdfRenderArea table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    #pdfRenderArea th, #pdfRenderArea td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 12px;
    }
    #pdfRenderArea th {
      background-color: #f2f2f2;
      color: #333;
    }
    #pdfRenderArea img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
    <!-- Navigation Bar with 5 Pages -->
    <nav style="display: flex; align-items: center; gap: 12px;">
      <a href="index.html" title="Home" style="font-size: 1.2rem; padding: 6px 10px; color: #2563eb;"><i class="fa-solid fa-house"></i></a>
      <a href="inventory.html" title="Inventory" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-boxes-stacked"></i></a>
      <a href="supply-requests.html" title="Supply Requests" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-truck-ramp-box"></i></a>
      <a href="procurement.html" title="Procurement" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-clipboard-list"></i></a>
      <a href="settings.html" title="Settings" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-gear"></i></a>
      <button class="btn btn-danger" onclick="logout()" title="Logout" style="padding: 6px 10px; border: none; background: transparent; color: #e53e3e; font-size: 1.2rem; cursor: pointer;">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </nav>
    <div class="user-info">
      <span id="currentUserDisplay" style="font-weight: 600;"></span>
    </div>
  </header>

  <div class="container">
    <h2>Dashboard & Analytics</h2>

    <div class="dashboard-grid">
      
      <!-- Card 1: Low Stock Alerts (Limited to max 3 items preview, Displaying Total Count) -->
      <div class="widget-card">
        <div>
          <div class="widget-header">
            <div class="widget-title" style="color: #f59e0b;">
              <i class="fa-solid fa-triangle-exclamation"></i> Low Stock Alerts
            </div>
            <span class="badge-count warning" id="lowStockCount">0</span>
          </div>

          <div class="preview-list" id="lowStockPreview">
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Loading...</p>
          </div>
        </div>

        <button class="btn btn-secondary" onclick="openLowStockModal()" style="margin-top: 15px; text-align: center; font-size: 0.85rem; width: 100%;">
          View All & Export PDF <i class="fa-solid fa-expand"></i>
        </button>
      </div>

      <!-- Card 2: Pending Orders -->
      <div class="widget-card">
        <div>
          <div class="widget-header">
            <div class="widget-title" style="color: #3b82f6;">
              <i class="fa-solid fa-clock-rotate-left"></i> Pending Orders
            </div>
            <span class="badge-count" style="background: #3b82f6;" id="pendingOrdersCount">0</span>
          </div>

          <div class="preview-list" id="pendingOrdersPreview">
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Loading...</p>
          </div>
        </div>

        <a href="supply-requests.html?status=New" class="btn btn-secondary" style="margin-top: 15px; text-align: center; font-size: 0.85rem;">
          Manage All Orders <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

    </div>
  </div>

  <!-- Modal: Low Stock View & Export PDF -->
  <div id="lowStockModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width: 650px; max-height: 88vh; display: flex; flex-direction: column;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color, #444); padding-bottom: 10px;">
        <h3 style="margin: 0; color: #f59e0b;"><i class="fa-solid fa-cart-flatbed"></i> Low Stock Report & PDF Builder</h3>
        <button onclick="closeModal('lowStockModal')" style="background: none; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>

      <!-- Option to append extra product to PDF -->
      <div style="display: flex; gap: 8px; margin-top: 12px; align-items: center;">
        <select id="extraProductSelect" style="flex: 1; padding: 6px 10px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px;">
          <option value="">-- Add Extra Product to PDF --</option>
        </select>
        <button class="btn" onclick="addExtraProductToList()" style="padding: 6px 12px; font-size: 0.85rem;"><i class="fa-solid fa-plus"></i> Add</button>
      </div>

      <!-- Scrollable List of Low Stock Products -->
      <div style="flex: 1; overflow-y: auto; margin: 15px 0;" id="fullLowStockList"></div>

      <!-- Modal Action Footer -->
      <div style="display: flex; gap: 10px; border-top: 1px solid var(--border-color, #444); padding-top: 10px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal('lowStockModal')">Close</button>
        <button class="btn" style="flex: 2; background: #2563eb;" onclick="exportPurchasePDF()"><i class="fa-solid fa-file-pdf"></i> Export Purchase PDF</button>
      </div>

    </div>
  </div>

  <!-- Hidden Container for PDF Rendering -->
  <div id="pdfRenderArea">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px;">
      <div>
        <h2 style="margin: 0; color: #1e3a8a;">PURCHASE REQUISITION ORDER</h2>
        <p style="margin: 5px 0 0 0; font-size: 11px; color: #666;">Generated for Procurement Department</p>
      </div>
      <div style="text-align: right; font-size: 11px;">
        <p style="margin: 2px 0;"><strong>Date:</strong> <span id="pdfDate"></span></p>
        <p style="margin: 2px 0;"><strong>Requested By:</strong> <span id="pdfUser"></span></p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 15%;">Image</th>
          <th style="width: 25%;">SKU</th>
          <th style="width: 40%;">Product Name</th>
          <th style="width: 20%;">Requested Qty</th>
        </tr>
      </thead>
      <tbody id="pdfTableBody"></tbody>
    </table>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allAvailableProducts = [];
    let activePurchaseItems = [];

    async function loadDashboardCards() {
      const { data: products } = await _supabase.from('products').select('*').eq('is_disabled', false);
      
      if (products) {
        allAvailableProducts = products;
        
        // Filter Low Stock Products
        const lowStock = products.filter(p => p.quantity <= (p.min_limit || p.min_stock || 5));
        
        // Update total count badge
        document.getElementById('lowStockCount').innerText = lowStock.length;

        const lowContainer = document.getElementById('lowStockPreview');
        lowContainer.innerHTML = '';

        if (lowStock.length === 0) {
          lowContainer.innerHTML = '<p style="text-align:center; color:#10b981; font-size:0.85rem;">All stock levels are optimal 👍</p>';
        } else {
          // Display maximum 3 items only in the display preview card
          lowStock.slice(0, 3).forEach(p => {
            const img = p.image_url || 'https://via.placeholder.com/40';
            const name = p.name_en || p.name_ar;
            lowContainer.innerHTML += `
              <div class="preview-item">
                <img src="${img}" alt="${name}" onerror="this.src='https://via.placeholder.com/40'">
                <div class="preview-info">
                  <div class="preview-name">${name}</div>
                  <div class="preview-sub">Current Stock: <strong style="color:#f59e0b;">${p.quantity}</strong> | Min Limit: ${p.min_limit || 5}</div>
                </div>
              </div>
            `;
          });
        }

        populateExtraProductsDropdown();
      }

      // Fetch Pending Orders
      const { data: orders } = await _supabase.from('orders').select('*').eq('status', 'New').order('id', { ascending: false });
      if (orders) {
        document.getElementById('pendingOrdersCount').innerText = orders.length;
        const ordersContainer = document.getElementById('pendingOrdersPreview');
        ordersContainer.innerHTML = '';

        if (orders.length === 0) {
          ordersContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem;">No pending requests 🎉</p>';
        } else {
          orders.slice(0, 3).forEach(o => {
            ordersContainer.innerHTML += `
              <div class="preview-item">
                <div style="background:#3b82f6; color:#fff; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.8rem;">
                  <i class="fa-solid fa-box"></i>
                </div>
                <div class="preview-info">
                  <div class="preview-name">${o.order_number} - ${o.user_name || 'Staff'}</div>
                  <div class="preview-sub">Items: ${o.total_items} | Brand: ${o.brand || '-'}</div>
                </div>
              </div>
            `;
          });
        }
      }
    }

    function populateExtraProductsDropdown() {
      const select = document.getElementById('extraProductSelect');
      if (!select) return;
      select.innerHTML = '<option value="">-- Add Extra Product to PDF --</option>';
      allAvailableProducts.forEach(p => {
        const name = p.name_en || p.name_ar;
        select.innerHTML += `<option value="${p.id}">${name} (SKU: ${p.sku || 'N/A'})</option>`;
      });
    }

    function openLowStockModal() {
      activePurchaseItems = allAvailableProducts
        .filter(p => p.quantity <= (p.min_limit || p.min_stock || 5))
        .map(p => ({
          ...p,
          requestedQty: (p.min_limit || 5) * 2
        }));

      renderModalItemList();
      openModal('lowStockModal');
    }

    function renderModalItemList() {
      const container = document.getElementById('fullLowStockList');
      container.innerHTML = '';

      if (activePurchaseItems.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted);">No low-stock products to display.</p>';
        return;
      }

      activePurchaseItems.forEach((p, index) => {
        const img = p.image_url || 'https://via.placeholder.com/48';
        const nameEn = p.name_en || p.name_ar || 'N/A';
        const sku = p.sku || 'N/A';

        container.innerHTML += `
          <div class="modal-low-stock-item">
            <img src="${img}" alt="${nameEn}" onerror="this.src='https://via.placeholder.com/48'">
            <div style="flex: 1;">
              <div style="font-weight: bold; font-size: 0.88rem; color: var(--text-color);">${nameEn}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted);">SKU: ${sku} | Stock: <strong style="color:#e53e3e">${p.quantity}</strong></div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
              <div class="qty-picker">
                <button class="qty-picker-btn" onclick="adjustQty(${index}, -1)">-</button>
                <input type="number" class="qty-picker-input" value="${p.requestedQty}" onchange="setManualQty(${index}, this.value)">
                <button class="qty-picker-btn" onclick="adjustQty(${index}, 1)">+</button>
              </div>
              <button onclick="removeItemFromList(${index})" style="background:none; border:none; color:#e53e3e; cursor:pointer; font-size:1rem;" title="Remove"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }

    function adjustQty(index, change) {
      if (!activePurchaseItems[index]) return;
      activePurchaseItems[index].requestedQty += change;
      if (activePurchaseItems[index].requestedQty < 1) activePurchaseItems[index].requestedQty = 1;
      renderModalItemList();
    }

    function setManualQty(index, val) {
      if (!activePurchaseItems[index]) return;
      let qty = parseInt(val) || 1;
      if (qty < 1) qty = 1;
      activePurchaseItems[index].requestedQty = qty;
      renderModalItemList();
    }

    function removeItemFromList(index) {
      activePurchaseItems.splice(index, 1);
      renderModalItemList();
    }

    function addExtraProductToList() {
      const select = document.getElementById('extraProductSelect');
      const selectedId = select.value;
      if (!selectedId) return;

      const prod = allAvailableProducts.find(p => p.id == selectedId);
      if (!prod) return;

      const existing = activePurchaseItems.find(p => p.id == selectedId);
      if (existing) {
        existing.requestedQty += 1;
      } else {
        activePurchaseItems.push({
          ...prod,
          requestedQty: (prod.min_limit || 5) * 2
        });
      }

      select.value = '';
      renderModalItemList();
    }

    function exportPurchasePDF() {
      if (activePurchaseItems.length === 0) {
        return alert("Please select at least one item to export.");
      }

      const pdfTableBody = document.getElementById('pdfTableBody');
      pdfTableBody.innerHTML = '';

      activePurchaseItems.forEach(p => {
        const img = p.image_url || 'https://via.placeholder.com/40';
        const sku = p.sku || 'N/A';
        const nameEn = p.name_en || p.name_ar || 'N/A';

        pdfTableBody.innerHTML += `
          <tr>
            <td style="text-align: center;"><img src="${img}" crossorigin="anonymous"></td>
            <td><strong>${sku}</strong></td>
            <td>${nameEn}</td>
            <td style="font-weight: bold; text-align: center; font-size: 14px;">${p.requestedQty}</td>
          </tr>
        `;
      });

      document.getElementById('pdfDate').innerText = new Date().toLocaleDateString('en-US');
      const currentUser = JSON.parse(localStorage.getItem('app_user') || '{}');
      document.getElementById('pdfUser').innerText = currentUser.name || currentUser.email || 'Store Manager';

      const element = document.getElementById('pdfRenderArea');
      element.style.display = 'block';

      const opt = {
        margin:       [10, 10, 10, 10],
        filename:     `Purchase_Requisition_${new Date().toISOString().slice(0,10)}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.style.display = 'none';
      });
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'flex';
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', loadDashboardCards);
  </script>
</body>
</html>
