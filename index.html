<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Inventory Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
    <nav style="display: flex; align-items: center; gap: 12px;">
      <a href="index.html" title="Home" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-house"></i></a>
      <a href="inventory.html" title="Inventory" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-boxes-stacked"></i></a>
      <a href="supply-requests.html" title="Supply Requests" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-truck-ramp-box"></i></a>
      <a href="settings.html" title="Settings" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-gear"></i></a>
      <button class="btn btn-danger" onclick="logout()" title="Logout" style="padding: 6px 10px; border: none; background: transparent; color: #e53e3e; font-size: 1.2rem; cursor: pointer;">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </nav>
    <div class="user-info" style="display: flex; align-items: center;">
      <span id="currentUserDisplay" style="font-weight: 600;"></span>
    </div>
  </header>

  <div class="container" style="padding: 20px;">
    <h2>Dashboard Overview</h2>
    
    <!-- Stats Cards Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px;">
      <div class="card" style="display: flex; align-items: center; gap: 15px; padding: 20px;">
        <i class="fa-solid fa-box" style="font-size: 2.5rem; color: #3182ce;"></i>
        <div>
          <h3 id="statTotalProducts" style="margin: 0; font-size: 1.8rem;">0</h3>
          <p style="margin: 0; color: #888;">Total Products</p>
        </div>
      </div>

      <div class="card" style="display: flex; align-items: center; gap: 15px; padding: 20px;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: #e53e3e;"></i>
        <div>
          <h3 id="statLowStock" style="margin: 0; font-size: 1.8rem; color: #e53e3e;">0</h3>
          <p style="margin: 0; color: #888;">Low Stock Alerts</p>
        </div>
      </div>

      <div class="card" style="display: flex; align-items: center; gap: 15px; padding: 20px;">
        <i class="fa-solid fa-truck-loading" style="font-size: 2.5rem; color: #dd6b20;"></i>
        <div>
          <h3 id="statPendingRequests" style="margin: 0; font-size: 1.8rem;">0</h3>
          <p style="margin: 0; color: #888;">Pending Requests</p>
        </div>
      </div>
    </div>

    <!-- Quick Shortcuts -->
    <div class="card" style="margin-top: 25px;">
      <h3>Quick Actions</h3>
      <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;">
        <a href="inventory.html" class="btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-boxes-stacked"></i> View Inventory
        </a>
        <a href="supply-requests.html" class="btn btn-warning" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-truck-ramp-box"></i> Supply Requests
        </a>
        <a href="settings.html" class="btn btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-users"></i> Manage Users
        </a>
      </div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadDashboardStats() {
      try {
        // 1. Get Total Products & Low Stock
        const { data: products } = await _supabase.from('products').select('quantity, min_quantity');
        if (products) {
          document.getElementById('statTotalProducts').innerText = products.length;
          const lowStockCount = products.filter(p => p.quantity <= (p.min_quantity || 0)).length;
          document.getElementById('statLowStock').innerText = lowStockCount;
        }

        // 2. Get Pending Supply Requests
        const { data: requests } = await _supabase.from('orders').select('id').eq('status', 'Pending');
        if (requests) {
          document.getElementById('statPendingRequests').innerText = requests.length;
        }
      } catch (err) {
        console.error("Dashboard error:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboardStats);
  </script>
</body>
</html>
