<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرئيسية - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- مكتبة تحويل HTML إلى PDF بشكل احترافي مع الصور -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .widget-card {
      background: var(--card-bg, #1e1e1e);
      border: 1px solid var(--border-color, #333);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color, #333);
    }
    .widget-title {
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-count {
      background: #e53e3e;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .badge-count.warning {
      background: #f59e0b;
    }
    .preview-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .preview-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--input-bg, #2a2a2a);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .preview-item img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color, #444);
    }
    .preview-info {
      flex: 1;
    }
    .preview-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-color, #fff);
    }
    .preview-sub {
      font-size: 0.75rem;
      color: var(--text-muted, #aaa);
    }

    /* تنسيق كروت المعاينة داخل المودال */
    .modal-low-stock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background: var(--input-bg, #222);
      border: 1px solid var(--border-color, #444);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .modal-low-stock-item img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color, #555);
    }

    /* جدول التصدير المخفي للـ PDF */
    #pdfRenderArea {
      display: none;
      background: #ffffff;
      color: #000000;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #pdfRenderArea table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    #pdfRenderArea th, #pdfRenderArea td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 12px;
    }
    #pdfRenderArea th {
      background-color: #f2f2f2;
      color: #333;
    }
    #pdfRenderArea img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
    <nav style="display: flex; align-items: center; gap: 12px;">
      <a href="index.html" title="الرئيسية" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-house"></i></a>
      <a href="inventory.html" title="المخزون" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-boxes-stacked"></i></a>
      <a href="supply-requests.html" title="طلبات التوريد" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-truck-ramp-box"></i></a>
      <a href="settings.html" title="الإعدادات" style="font-size: 1.2rem; padding: 6px 10px;"><i class="fa-solid fa-gear"></i></a>
    </nav>
    <div class="user-info">
      <span id="currentUserDisplay" style="font-weight: 600;"></span>
    </div>
  </header>

  <div class="container">
    <h2>لوحة التحكم والتحليلات</h2>

    <div class="dashboard-grid">
      
      <!-- الكارت الأول: منتجات بلغت الحد الأدنى -->
      <div class="widget-card">
        <div>
          <div class="widget-header">
            <div class="widget-title" style="color: #f59e0b;">
              <i class="fa-solid fa-triangle-exclamation"></i> تنبيهات الحد الأدنى
            </div>
            <span class="badge-count warning" id="lowStockCount">0</span>
          </div>

          <div class="preview-list" id="lowStockPreview">
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">جاري التحميل...</p>
          </div>
        </div>

        <button class="btn btn-secondary" onclick="openLowStockModal()" style="margin-top: 15px; text-align: center; font-size: 0.85rem; width: 100%;">
          عرض كل منتجات الحد الأدنى <i class="fa-solid fa-expand"></i>
        </button>
      </div>

      <!-- الكارت الثاني: الطلبات الجديدة المعلقة -->
      <div class="widget-card">
        <div>
          <div class="widget-header">
            <div class="widget-title" style="color: #3b82f6;">
              <i class="fa-solid fa-clock-rotate-left"></i> الطلبات الجديدة المعلقة
            </div>
            <span class="badge-count" style="background: #3b82f6;" id="pendingOrdersCount">0</span>
          </div>

          <div class="preview-list" id="pendingOrdersPreview">
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">جاري التحميل...</p>
          </div>
        </div>

        <a href="supply-requests.html?status=New" class="btn btn-secondary" style="margin-top: 15px; text-align: center; font-size: 0.85rem;">
          إدارة كل الطلبات <i class="fa-solid fa-arrow-left"></i>
        </a>
      </div>

    </div>
  </div>

  <!-- النافذة المنبثقة: قائمة منتجات الحد الأدنى المكتملة -->
  <div id="lowStockModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width: 650px; max-height: 85vh; display: flex; flex-direction: column;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color, #444); padding-bottom: 10px;">
        <h3 style="margin: 0; color: #f59e0b;"><i class="fa-solid fa-triangle-exclamation"></i> قائمة المنتجات الواصلة للحد الأدنى</h3>
        <button onclick="closeModal('lowStockModal')" style="background: none; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>

      <!-- القائمة الجانبية للتمرير -->
      <div style="flex: 1; overflow-y: auto; margin: 15px 0;" id="fullLowStockList"></div>

      <!-- الأزرار والعمليات -->
      <div style="display: flex; gap: 10px; border-top: 1px solid var(--border-color, #444); padding-top: 10px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal('lowStockModal')">إغلاق</button>
        <button class="btn" style="flex: 2; background: #2563eb;" onclick="exportPurchasePDF()"><i class="fa-solid fa-file-pdf"></i> تصدير PDF للمشتريات</button>
      </div>

    </div>
  </div>

  <!-- حاوية طباعة PDF (مخفية وتصمَّم بلغة إنجليزية رسمية) -->
  <div id="pdfRenderArea">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px;">
      <div>
        <h2 style="margin: 0; color: #1e3a8a;">PURCHASE REQUISITION ORDER</h2>
        <p style="margin: 5px 0 0 0; font-size: 11px; color: #666;">Low Stock Replenishment Request</p>
      </div>
      <div style="text-align: right; font-size: 11px;">
        <p style="margin: 2px 0;"><strong>Date:</strong> <span id="pdfDate"></span></p>
        <p style="margin: 2px 0;"><strong>Generated By:</strong> <span id="pdfUser"></span></p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 15%;">Image</th>
          <th style="width: 25%;">SKU</th>
          <th style="width: 40%;">Product Name (English)</th>
          <th style="width: 20%;">Requested Qty</th>
        </tr>
      </thead>
      <tbody id="pdfTableBody"></tbody>
    </table>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let globalLowStockProducts = [];

    async function loadDashboardCards() {
      const { data: products } = await _supabase.from('products').select('*').eq('is_disabled', false);
      
      if (products) {
        globalLowStockProducts = products.filter(p => p.quantity <= (p.min_limit || p.min_stock || 5));
        
        document.getElementById('lowStockCount').innerText = globalLowStockProducts.length;
        const lowContainer = document.getElementById('lowStockPreview');
        lowContainer.innerHTML = '';

        if (globalLowStockProducts.length === 0) {
          lowContainer.innerHTML = '<p style="text-align:center; color:#10b981; font-size:0.85rem;">جميع المنتجات في مستويات آمنة 👍</p>';
        } else {
          // عرض 3 منتجات فقط في الكارت الرئيسي
          globalLowStockProducts.slice(0, 3).forEach(p => {
            const img = p.image_url || 'https://via.placeholder.com/40';
            const name = p.name_ar || p.name_en;
            lowContainer.innerHTML += `
              <div class="preview-item">
                <img src="${img}" alt="${name}" onerror="this.src='https://via.placeholder.com/40'">
                <div class="preview-info">
                  <div class="preview-name">${name}</div>
                  <div class="preview-sub">المخزون الحالي: <strong style="color:#f59e0b;">${p.quantity}</strong> | الحد الأدنى: ${p.min_limit || 5}</div>
                </div>
              </div>
            `;
          });
        }
      }

      // جلب الطلبات المعلقة
      const { data: orders } = await _supabase.from('orders').select('*').eq('status', 'New').order('id', { ascending: false });
      if (orders) {
        document.getElementById('pendingOrdersCount').innerText = orders.length;
        const ordersContainer = document.getElementById('pendingOrdersPreview');
        ordersContainer.innerHTML = '';

        if (orders.length === 0) {
          ordersContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem;">لا توجد طلبات جديدة معلقة 🎉</p>';
        } else {
          orders.slice(0, 3).forEach(o => {
            ordersContainer.innerHTML += `
              <div class="preview-item">
                <div style="background:#3b82f6; color:#fff; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.8rem;">
                  <i class="fa-solid fa-box"></i>
                </div>
                <div class="preview-info">
                  <div class="preview-name">${o.order_number} - ${o.user_name || 'موظف'}</div>
                  <div class="preview-sub">عدد المواد: ${o.total_items} | الماركة: ${o.brand || '-'}</div>
                </div>
              </div>
            `;
          });
        }
      }
    }

    // فتح النافذة المنبثقة وعرض جميع منتجات الحد الأدنى
    function openLowStockModal() {
      const container = document.getElementById('fullLowStockList');
      container.innerHTML = '';

      if (globalLowStockProducts.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد منتجات واصلة للحد الأدنى حالياً.</p>';
      } else {
        globalLowStockProducts.forEach(p => {
          const img = p.image_url || 'https://via.placeholder.com/50';
          const nameEn = p.name_en || p.name_ar || 'N/A';
          const sku = p.sku || 'N/A';
          const defaultReqQty = (p.min_limit || 5) * 2; // اقتراح كمية مطلوبة تلقائياً

          container.innerHTML += `
            <div class="modal-low-stock-item">
              <img src="${img}" alt="${nameEn}" onerror="this.src='https://via.placeholder.com/50'">
              <div style="flex: 1;">
                <div style="font-weight: bold; font-size: 0.88rem; color: var(--text-color);">${nameEn}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">SKU: ${sku} | المخزون الحالي: <strong style="color:#e53e3e">${p.quantity}</strong></div>
              </div>
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                <label style="font-size: 0.7rem; color: var(--text-muted);">الكمية المطلوبة:</label>
                <input type="number" id="req-qty-${p.id}" value="${defaultReqQty}" min="1" style="width: 70px; padding: 4px; text-align: center; border-radius: 4px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-weight: bold;">
              </div>
            </div>
          `;
        });
      }

      openModal('lowStockModal');
    }

    // تصدير ملف PDF بتنسيق المشتريات
    function exportPurchasePDF() {
      if (globalLowStockProducts.length === 0) {
        return alert("لا توجد منتجات لتصديرها.");
      }

      const pdfTableBody = document.getElementById('pdfTableBody');
      pdfTableBody.innerHTML = '';

      // تعبئة جدول الـ PDF بالمعلومات المطلوبة بالإنجليزية
      globalLowStockProducts.forEach(p => {
        const img = p.image_url || 'https://via.placeholder.com/40';
        const sku = p.sku || 'N/A';
        const nameEn = p.name_en || p.name_ar || 'N/A';
        const qtyInput = document.getElementById(`req-qty-${p.id}`);
        const requestedQty = qtyInput ? qtyInput.value : 1;

        pdfTableBody.innerHTML += `
          <tr>
            <td style="text-align: center;"><img src="${img}" crossorigin="anonymous"></td>
            <td><strong>${sku}</strong></td>
            <td>${nameEn}</td>
            <td style="font-weight: bold; text-align: center; font-size: 14px;">${requestedQty}</td>
          </tr>
        `;
      });

      // إعداد بيانات الترويسة
      document.getElementById('pdfDate').innerText = new Date().toLocaleDateString('en-US');
      const currentUser = JSON.parse(localStorage.getItem('app_user') || '{}');
      document.getElementById('pdfUser').innerText = currentUser.name || currentUser.email || 'Store Manager';

      // إظهار منطقة الطباعة مؤقتاً لالتقاط الصور
      const element = document.getElementById('pdfRenderArea');
      element.style.display = 'block';

      // إعداد خيارات إنشاء PDF
      const opt = {
        margin:       [10, 10, 10, 10],
        filename:     `Purchase_Request_${new Date().toISOString().slice(0,10)}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      // توليد وحفظ PDF
      html2pdf().set(opt).from(element).save().then(() => {
        element.style.display = 'none'; // إعادة إخفاء الحاوية بعد الطباعة
      });
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'flex';
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', loadDashboardCards);
  </script>
</body>
</html>
