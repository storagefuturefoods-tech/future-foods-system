<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - User Management</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-users-gear"></i> User & Permission Management</h1>
    <nav>
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="inventory.html"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
      <a href="supply-requests.html"><i class="fa-solid fa-truck-ramp-box"></i> Supply Requests</a>
      <a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <div class="user-info">
      <span id="currentUserDisplay"><i class="fa-solid fa-user"></i> </span>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3><i class="fa-solid fa-list-check"></i> Users & Permissions List</h3>
        <button class="btn" onclick="openModal('userModal')"><i class="fa-solid fa-user-plus"></i> Add New User</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Branch / Brand Permission</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <!-- Data populated dynamically via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal: Add / Edit User -->
  <div id="userModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 id="modalTitle"><i class="fa-solid fa-user-pen"></i> Add New User</h3>
      <form onsubmit="saveUser(event)" style="margin-top:15px;">
        <input type="hidden" id="uId">
        
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="uName" required>
        </div>
        
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="uEmail" required>
        </div>
        
        <div class="form-group" id="passGroup">
          <label>Temporary Password</label>
          <input type="password" id="uPass">
        </div>
        
        <div class="form-group">
          <label>System Role Permission</label>
          <select id="uRole" required>
            <option value="admin">System Admin (Full Access + Inventory & Requests Edit)</option>
            <option value="store_manager">Store Manager (Edit Inventory + Approve Requests)</option>
            <option value="chef">Chef / Branch (Create Supply Requests Only - No Inventory Edit)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Brand / Branch Permission</label>
          <select id="uBrand" required>
            <option value="All">All Branches (Rudy + B-marlin + Shared)</option>
            <option value="Rudy">Rudy (Includes Rudy & Shared Products)</option>
            <option value="B-marlin">B-marlin (Includes B-marlin & Shared Products)</option>
          </select>
        </div>

        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Save Data</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('userModal')"><i class="fa-solid fa-xmark"></i> Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script Includes -->
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
