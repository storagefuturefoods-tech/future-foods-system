<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات - إدارة المستخدمين</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h1>إدارة المستخدمين والصلاحيات</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="inventory.html">المخزون</a>
      <a href="supply-requests.html">طلبات التغذية</a>
      <a href="settings.html">الإعدادات</a>
    </nav>
    <div class="user-info">
      <span id="currentUserDisplay"></span>
      <button class="btn btn-secondary" onclick="toggleLanguage()">Ar/En</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>قائمة المستخدمين والصلاحيات</h3>
        <button class="btn" onclick="openModal('userModal')">+ إضافة مستخدم جديد</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>البريد الإلكتروني</th>
            <th>نوع الصلاحية (الدور)</th>
            <th>صلاحية الفرع / البراند</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <!-- سيتم تعبئة البيانات هنا عبر الجافاسكريبت -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal إضافة / تعديل مستخدم -->
  <div id="userModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 id="modalTitle">إضافة مستخدم جديد</h3>
      <form onsubmit="saveUser(event)" style="margin-top:15px;">
        <input type="hidden" id="uId">
        
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="uName" required>
        </div>
        
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="uEmail" required>
        </div>
        
        <div class="form-group" id="passGroup">
          <label>كلمة السر المؤقتة</label>
          <input type="password" id="uPass">
        </div>
        
        <div class="form-group">
          <label>نوع الصلاحية في النظام</label>
          <select id="uRole" required>
            <option value="admin">مدير النظام (تحكم كامل + تعديل مخزون وطلبات)</option>
            <option value="store_manager">مدير مخزن (تعديل وتغذية المخزون + الموافقة على الطلبات)</option>
            <option value="chef">شيف / فرع (إنشاء طلبات تغذية فقط دون تعديل المخزون)</option>
          </select>
        </div>

        <div class="form-group">
          <label>صلاحية البراند / الفرع</label>
          <select id="uBrand" required>
            <option value="All">كل الفروع (Rudy + B-marlin + المشترك)</option>
            <option value="Rudy">Rudy (يشمل منتجات Rudy والمشترك)</option>
            <option value="B-marlin">B-marlin (يشمل منتجات B-marlin والمشترك)</option>
          </select>
        </div>

        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" class="btn">حفظ البيانات</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('userModal')">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ترتيب استدعاء الملفات هام جداً -->
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
