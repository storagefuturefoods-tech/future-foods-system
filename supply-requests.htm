<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات التغذية</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>طلبات التغذية</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="inventory.html">المخزون</a>
      <a href="supply-requests.html">طلبات التغذية</a>
      <a href="settings.html">الإعدادات</a>
    </nav>
    <div class="user-info">
      <div class="cart-icon" onclick="openModal('cartModal')">🛒 <span class="cart-badge" id="cartCount">0</span></div>
      <span id="currentUserDisplay"></span>
      <button class="btn btn-secondary" onclick="toggleLanguage()">Ar/En</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <button class="btn" onclick="openSupplyModal()">+ طلب تغذية جديد</button>
        <div>
          <select id="statusFilter" onchange="loadOrders()">
            <option value="الكل">كل الحالات</option>
            <option value="جديد">جديد</option>
            <option value="جاري التجهيز">جاري التجهيز</option>
            <option value="جاهز">جاهز</option>
            <option value="مكتمل">مكتمل</option>
            <option value="ملغي">ملغي</option>
          </select>
          <button class="btn btn-secondary" onclick="exportOrders()">تصدير الطلبات</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllOrders" onclick="toggleSelectAllOrders(this)"></th>
            <th>رقم الطلب</th>
            <th>المستخدم</th>
            <th>البراند</th>
            <th>عدد المنتجات</th>
            <th>الحالة</th>
            <th>ملاحظات</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal اختيار المنتجات للطلب -->
  <div id="supplyModal" class="modal">
    <div class="modal-content">
      <h3>إضافة طلب تغذية جديد</h3>
      <input type="text" id="prodSearch" placeholder="بحث باسم المنتج..." oninput="filterProducts()" style="width:100%; padding:8px; margin:10px 0;">
      <div class="grid-products" id="productsGrid"></div>
      <button class="btn btn-secondary" style="margin-top:15px;" onclick="closeModal('supplyModal')">إغلاق</button>
    </div>
  </div>

  <!-- Modal السلة -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <h3>سلة الطلبات</h3>
      <div id="cartItemsList"></div>
      <div class="form-group" style="margin-top:15px;">
        <label>ملاحظات الطلب:</label>
        <textarea id="orderNotes" rows="3"></textarea>
      </div>
      <button class="btn" onclick="submitOrder()">إرسال الطلب النهائي</button>
      <button class="btn btn-secondary" onclick="closeModal('cartModal')">إلغاء</button>
    </div>
  </div>

  <!-- Modal تفاصيل الطلب و سجل التعديلات -->
  <div id="orderDetailsModal" class="modal">
    <div class="modal-content">
      <h3>تفاصيل الطلب <span id="modalOrderNum"></span></h3>
      <div id="orderDetailsContent"></div>
      <h4>سجل الإجراءات (Audit Log):</h4>
      <ul class="timeline" id="orderTimeline"></ul>
      <button class="btn btn-secondary" onclick="closeModal('orderDetailsModal')">إغلاق</button>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/supply.js"></script>
</body>
</html>
