<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurement & Supply Orders</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <header class="navbar-header">
    <nav class="nav-links">
      <a href="index.html" title="Home"><i class="fa-solid fa-house"></i></a>
      <a href="inventory.html" title="Inventory"><i class="fa-solid fa-boxes-stacked"></i></a>
      <a href="supply-requests.html" title="Supply Requests"><i class="fa-solid fa-truck-ramp-box"></i></a>
      <a href="procurement.html" title="Procurement" class="active-link"><i class="fa-solid fa-clipboard-list"></i></a>
      <a href="settings.html" title="Settings"><i class="fa-solid fa-gear"></i></a>

      <button class="btn btn-danger btn-logout" onclick="logout()" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </nav>
    <div class="user-info">
      <span id="currentUserDisplay"></span>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h2>Procurement & Supply Orders</h2>
      <button class="btn btn-primary" onclick="openCreateOrderModal()">
        <i class="fa-solid fa-cart-plus"></i> New Supply Order
      </button>
    </div>

    <!-- Tabs Filter -->
    <div class="tabs-container">
      <button class="tab-btn active" onclick="filterOrders('All', this)">All Orders</button>
      <button class="tab-btn" onclick="filterOrders('Pending', this)">Pending</button>
      <button class="tab-btn" onclick="filterOrders('Ordered', this)">Ordered</button>
      <button class="tab-btn" onclick="filterOrders('Completed', this)">Completed</button>
      <button class="tab-btn" onclick="filterOrders('Cancelled', this)">Cancelled</button>
    </div>

    <div id="ordersList">
      <p class="loading-text">Loading procurement orders...</p>
    </div>
  </div>

  <!-- Modal 1: Create Supply Order -->
  <div id="createOrderModal" class="modal" style="display:none;">
    <div class="modal-content modal-large">
      
      <div class="modal-header">
        <h3><i class="fa-solid fa-boxes-packing"></i> Create Supply Order</h3>
        <button onclick="closeModal('createOrderModal')" class="close-btn">✕</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary btn-sm" onclick="openProductSelectorModal()">
          <i class="fa-solid fa-plus"></i> Add Product from Catalog
        </button>
        <button class="btn btn-warning btn-sm" onclick="autoAddLowStockItems()">
          <i class="fa-solid fa-bolt"></i> Auto-Add Low Stock Items
        </button>
      </div>

      <div class="modal-body scrollable" id="orderItemsContainer"></div>

      <div class="notes-group">
        <label>Order Notes / Instructions:</label>
        <input type="text" id="orderNotesInput" placeholder="Optional notes for procurement manager...">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary flex-1" onclick="closeModal('createOrderModal')">Cancel</button>
        <button class="btn btn-success flex-2" id="submitBtn" onclick="submitSupplyOrder()">
          <i class="fa-solid fa-paper-plane"></i> Submit Order
        </button>
      </div>

    </div>
  </div>

  <!-- Modal 2: Catalog Product Selector -->
  <div id="productSelectorModal" class="modal catalog-modal" style="display:none;">
    <div class="modal-content modal-medium">
      <div class="modal-header">
        <h3>Select Products</h3>
        <button onclick="closeModal('productSelectorModal')" class="close-btn">✕</button>
      </div>

      <div class="search-box">
        <input type="text" id="catalogSearchInput" placeholder="🔍 Search by Name or SKU..." oninput="renderCatalogProducts()">
      </div>

      <div class="modal-body scrollable" id="catalogContainer"></div>

      <div class="modal-footer right-align">
        <button class="btn btn-primary" onclick="closeModal('productSelectorModal')">Done Selecting</button>
      </div>
    </div>
  </div>

  <!-- Hidden PDF Area -->
  <div id="pdfRenderArea">
    <div class="pdf-header">
      <div>
        <h2>PURCHASE REQUISITION REPORT</h2>
        <p>Official Procurement Document</p>
      </div>
      <div class="pdf-meta">
        <p><strong>Order #:</strong> <span id="pdfOrderId"></span></p>
        <p><strong>Date:</strong> <span id="pdfDate"></span></p>
        <p><strong>Status:</strong> <span id="pdfStatus"></span></p>
      </div>
    </div>

    <div class="pdf-notes">
      <strong>Notes:</strong> <span id="pdfNotes">N/A</span>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 12%;">Image</th>
          <th style="width: 20%;">Box Pack</th>
          <th style="width: 38%;">Product Name</th>
          <th style="width: 15%;">Qty Ordered (Boxes)</th>
          <th style="width: 15%;">Total Pcs</th>
        </tr>
      </thead>
      <tbody id="pdfTableBody"></tbody>
    </table>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/procurement.js"></script>
</body>
</html>
