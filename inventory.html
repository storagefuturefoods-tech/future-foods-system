<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>Inventory Management</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="inventory.html">Inventory</a>
      <a href="supply-requests.html">Supply Requests</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="user-info">
      <span id="currentUserDisplay"></span>
      <button class="btn btn-secondary" onclick="toggleLanguage()">Ar/En</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between;">
        <div>
          <button class="btn" onclick="downloadTemplate()">Download Excel Template</button>
          <input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none" onchange="handleExcelUpload(event)">
          <button class="btn btn-warning" onclick="document.getElementById('excelInput').click()">Upload Products from Excel</button>
        </div>
        <div>
          <button class="btn btn-secondary" onclick="exportSelected()">Export Selected/All</button>
          <button class="btn btn-danger" onclick="deleteSelected()">Delete Selected</button>
        </div>
      </div>

      <table id="inventoryTable">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
            <th>Image</th>
            <th>SKU</th>
            <th>Name (Ar)</th>
            <th>Name (En)</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Box Capacity</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Edit Product Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>Edit Product</h3>
      <form id="editForm" onsubmit="saveProductEdit(event)" style="margin-top: 15px;">
        <input type="hidden" id="editProdId">
        <div class="form-group"><label>Image URL</label><input type="text" id="editImage"></div>
        <div class="form-group"><label>SKU Code</label><input type="text" id="editSku" required disabled></div>
        <div class="form-group"><label>Arabic Name</label><input type="text" id="editNameAr" required></div>
        <div class="form-group"><label>English Name</label><input type="text" id="editNameEn" required></div>
        <div class="form-group"><label>Brand</label><input type="text" id="editBrand" required></div>
        <div class="form-group"><label>Category</label><input type="text" id="editCategory" placeholder="e.g. Cheese, Sauces, Oils"></div>
        <div class="form-group"><label>Quantity (Items)</label><input type="number" id="editQty" required></div>
        <div class="form-group"><label>Min Alert Quantity</label><input type="number" id="editMinQty" required></div>
        <div class="form-group"><label>Items Per Box</label><input type="number" id="editBoxCap" required></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" class="btn">Save Changes</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('editModal')">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
