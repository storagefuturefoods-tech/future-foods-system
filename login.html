<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container login-container">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 20px;" data-i18n="login_title">System Login</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        
        <div class="form-group">
          <label data-i18n="email">Email Address</label>
          <!-- Default value removed for security -->
          <input type="email" id="loginEmail" required placeholder="example@domain.com" autocomplete="email">
        </div>
        
        <div class="form-group">
          <label data-i18n="password">Password</label>
          <!-- Default value removed for security -->
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;" data-i18n="login_btn">Login</button>
      </form>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const emailInput = document.getElementById('loginEmail').value.trim().toLowerCase();
      const passwordInput = document.getElementById('loginPassword').value.trim();

      if (!emailInput || !passwordInput) {
        alert("Please fill in all fields");
        return;
      }

      // Query the correct 'users' table using maybeSingle for direct verification
      const { data, error } = await _supabase
        .from('users')
        .select('*')
        .eq('email', emailInput)
        .eq('password', passwordInput)
        .maybeSingle();

      if (error) {
        console.error("Connection error:", error);
        alert("An error occurred while connecting to the database");
        return;
      }

      if (!data) {
        const msg = (typeof translations !== 'undefined' && translations[currentLang]) 
          ? translations[currentLang].invalid_login 
          : "Invalid email or password";
        alert(msg);
      } else {
        // Save user data using the primary app key 'app_user'
        localStorage.setItem('app_user', JSON.stringify(data));
        // Fallback key for compatibility
        localStorage.setItem('currentUser', JSON.stringify(data));
        
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
