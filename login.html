<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container login-container">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 20px;" data-i18n="login_title">تسجيل الدخول للنظام</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        
        <div class="form-group">
          <label data-i18n="email">البريد الإلكتروني</label>
          <!-- تم إزالة الـ value الافتراضية لحل الثغرة -->
          <input type="email" id="loginEmail" required placeholder="example@domain.com" autocomplete="email">
        </div>
        
        <div class="form-group">
          <label data-i18n="password">كلمة السر</label>
          <!-- تم إزالة الـ value الافتراضية لحل الثغرة -->
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;" data-i18n="login_btn">دخول</button>
      </form>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const emailInput = document.getElementById('loginEmail').value.trim().toLowerCase();
      const passwordInput = document.getElementById('loginPassword').value.trim();

      if (!emailInput || !passwordInput) {
        alert("يرجى تعبئة كافة الحقول");
        return;
      }

      // البحث في جدول users الصحيح باستخدام maybeSingle للتحقق المباشر
      const { data, error } = await _supabase
        .from('users')
        .select('*')
        .eq('email', emailInput)
        .eq('password', passwordInput)
        .maybeSingle();

      if (error) {
        console.error("خطأ في الاتصال:", error);
        alert("حدث خطأ أثناء الاتصال بقاعدة البيانات");
        return;
      }

      if (!data) {
        const msg = (typeof translations !== 'undefined' && translations[currentLang]) 
          ? translations[currentLang].invalid_login 
          : "البريد الإلكتروني أو كلمة السر غير صحيحة";
        alert(msg);
      } else {
        // حفظ بيانات المستخدم بنفس المفتاح المعتمد للنظام app_user
        localStorage.setItem('app_user', JSON.stringify(data));
        // مفتاح إضافي احتياطي للتوافق
        localStorage.setItem('currentUser', JSON.stringify(data));
        
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
